<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">

<title>Create Estimate | Parbez Smart Works</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="style.css">

<style>

.page-container{
  max-width:850px;
  margin:auto;
  padding:18px;
}

.page-title{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}

.back-btn{
  width:42px;
  height:42px;
  border:0;
  border-radius:13px;
  background:white;
  color:#2563eb;
  font-size:17px;
  cursor:pointer;
}

.form-card{
  background:white;
  border:1px solid #e2e8f0;
  border-radius:20px;
  padding:18px;
  margin-bottom:18px;
}

.form-card h3{
  font-size:16px;
  margin-bottom:15px;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:600;
  margin-bottom:6px;
}

.field input,
.field textarea,
.item input{
  width:100%;
  border:1px solid #dbe2ea;
  border-radius:11px;
  padding:12px;
  outline:none;
  font-size:14px;
  background:#f8fafc;
}

.field textarea{
  min-height:75px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus,
.item input:focus{
  border-color:#2563eb;
  background:white;
}

.item{
  border:1px solid #e2e8f0;
  border-radius:15px;
  padding:13px;
  margin-bottom:12px;
  background:#f8fafc;
}

.item-grid{
  display:grid;
  grid-template-columns:1fr 75px 95px;
  gap:8px;
}

.item-total{
  margin-top:10px;
  display:flex;
  justify-content:space-between;
  font-size:13px;
  font-weight:bold;
}

.delete-item{
  margin-top:9px;
  border:0;
  background:#fee2e2;
  color:#dc2626;
  padding:8px 12px;
  border-radius:9px;
  cursor:pointer;
  font-size:12px;
}

.add-btn{
  width:100%;
  border:1px dashed #2563eb;
  color:#2563eb;
  background:#eff6ff;
  padding:12px;
  border-radius:11px;
  font-weight:bold;
  cursor:pointer;
}

.package-notice{
  display:none;
  background:#eff6ff;
  border:1px solid #bfdbfe;
  color:#1d4ed8;
  padding:11px;
  border-radius:11px;
  margin-bottom:13px;
  font-size:12px;
}

.summary{
  margin-top:18px;
  background:#f8fafc;
  border-radius:15px;
  padding:15px;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
  font-size:14px;
}

.summary-row.total{
  border-top:1px solid #e2e8f0;
  padding-top:13px;
  font-size:19px;
  font-weight:bold;
}

.primary{
  width:100%;
  border:0;
  background:#2563eb;
  color:white;
  padding:14px;
  border-radius:12px;
  margin-top:16px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.secondary{
  width:100%;
  border:0;
  background:#dcfce7;
  color:#15803d;
  padding:13px;
  border-radius:12px;
  margin-top:10px;
  font-weight:bold;
  cursor:pointer;
}

@media(max-width:500px){

  .item-grid{
    grid-template-columns:1fr 65px 85px;
  }

}

@media print{

  .topbar,
  .back-btn,
  .add-btn,
  .delete-item,
  .primary,
  .secondary{
    display:none !important;
  }

  body{
    background:white;
    padding:0;
  }

  .page-container{
    max-width:none;
    padding:10px;
  }

  .form-card{
    border:1px solid #ccc;
    box-shadow:none;
  }

}

</style>

</head>


<body>


<header class="topbar">

<div class="brand">

<div class="brand-logo">

<i class="fa-solid fa-bolt"></i>

</div>

<div>

<h1>Parbez Smart Works</h1>

<p>
Electrical • Ceiling • Plumbing
</p>

</div>

</div>

</header>



<main class="page-container">


<div class="page-title">

<button
class="back-btn"
onclick="location.href='index.html'">

<i class="fa-solid fa-arrow-left"></i>

</button>

<h2>Create Estimate</h2>

</div>



<!-- CUSTOMER -->

<div class="form-card">

<h3>
Customer Details
</h3>


<div class="field">

<label>
Customer Name
</label>

<input
id="customerName"
type="text"
placeholder="Enter customer name">

</div>



<div class="field">

<label>
Mobile Number
</label>

<input
id="customerMobile"
type="tel"
maxlength="10"
inputmode="numeric"
placeholder="10 digit mobile number">

</div>



<div class="field">

<label>
Site Address
</label>

<textarea
id="siteAddress"
placeholder="Enter site address"></textarea>

</div>

</div>



<!-- ITEMS -->

<div class="form-card">

<h3>
Work / Items
</h3>


<div
id="packageNotice"
class="package-notice">
</div>


<div id="items"></div>


<button
class="add-btn"
onclick="addItem()">

<i class="fa-solid fa-plus"></i>

Add Item

</button>

</div>



<!-- CHARGES -->

<div class="form-card">

<h3>
Additional Charges
</h3>


<div class="field">

<label>
Labour Charge
</label>

<input
id="labour"
type="number"
min="0"
value="0"
oninput="calculateTotal()">

</div>



<div class="field">

<label>
Discount
</label>

<input
id="discount"
type="number"
min="0"
value="0"
oninput="calculateTotal()">

</div>



<div class="summary">


<div class="summary-row">

<span>
Items Total
</span>

<strong id="itemsTotal">
₹0
</strong>

</div>



<div class="summary-row">

<span>
Labour
</span>

<strong id="labourTotal">
₹0
</strong>

</div>



<div class="summary-row">

<span>
Discount
</span>

<strong id="discountTotal">
₹0
</strong>

</div>



<div class="summary-row total">

<span>
Grand Total
</span>

<strong id="grandTotal">
₹0
</strong>

</div>


</div>



<button
class="primary"
onclick="saveEstimate()">

<i class="fa-solid fa-floppy-disk"></i>

Save Estimate

</button>



<button
class="secondary"
onclick="printEstimate()">

<i class="fa-solid fa-print"></i>

Print / PDF

</button>


</div>


</main>



<script>


let itemNumber=0;



/* =========================
   ADD ITEM
========================= */

function addItem(name="", qty=1, rate=0){

itemNumber++;


const container=
document.getElementById("items");


const div=
document.createElement("div");


div.className="item";

div.dataset.id=itemNumber;


div.innerHTML=`

<div class="item-grid">

<input
class="item-name"
type="text"
placeholder="Item / Work"
value="${escapeHTML(name)}">

<input
class="item-qty"
type="number"
min="1"
value="${qty}"
oninput="calculateTotal()">

<input
class="item-rate"
type="number"
min="0"
value="${rate}"
oninput="calculateTotal()">

</div>


<div class="item-total">

<span>
Item Total
</span>

<span class="row-total">
₹0
</span>

</div>


<button
class="delete-item"
onclick="removeItem(this)">

<i class="fa-solid fa-trash"></i>

Remove

</button>

`;


container.appendChild(div);


calculateTotal();

}



/* =========================
   REMOVE ITEM
========================= */

function removeItem(button){

button.closest(".item").remove();

calculateTotal();

}



/* =========================
   CALCULATE TOTAL
========================= */

function calculateTotal(){

let total=0;


document
.querySelectorAll(".item")
.forEach(item=>{

const qty=
Number(
item.querySelector(".item-qty").value
)||0;


const rate=
Number(
item.querySelector(".item-rate").value
)||0;


const amount=
qty*rate;


total+=amount;


item.querySelector(".row-total")
.textContent=
"₹"+amount.toLocaleString("en-IN");

});



const labour=
Number(
document.getElementById("labour").value
)||0;


const discount=
Number(
document.getElementById("discount").value
)||0;


const grand=
Math.max(
0,
total+labour-discount
);



document.getElementById("itemsTotal")
.textContent=
"₹"+total.toLocaleString("en-IN");


document.getElementById("labourTotal")
.textContent=
"₹"+labour.toLocaleString("en-IN");


document.getElementById("discountTotal")
.textContent=
"₹"+discount.toLocaleString("en-IN");


document.getElementById("grandTotal")
.textContent=
"₹"+grand.toLocaleString("en-IN");

}



/* =========================
   SAVE ESTIMATE
========================= */

function saveEstimate(){

const customer=
document
.getElementById("customerName")
.value
.trim();


if(!customer){

alert(
"Please enter customer name."
);

return;

}



const items=[];


document
.querySelectorAll(".item")
.forEach(item=>{

const name=
item
.querySelector(".item-name")
.value
.trim();


const qty=
Number(
item
.querySelector(".item-qty")
.value
)||0;


const rate=
Number(
item
.querySelector(".item-rate")
.value
)||0;


if(name){

items.push({

name:name,

qty:qty,

rate:rate,

amount:qty*rate

});

}

});



if(!items.length){

alert(
"Please add at least one work item."
);

return;

}



const itemsTotal=
items.reduce(
(sum,item)=>
sum+item.amount,
0
);



const labour=
Number(
document.getElementById("labour").value
)||0;


const discount=
Number(
document.getElementById("discount").value
)||0;


const total=
Math.max(
0,
itemsTotal+labour-discount
);



const estimate={

id:Date.now(),

estimateNo:
"EST-"+String(
Date.now()
).slice(-6),

date:
new Date()
.toLocaleDateString("en-IN"),

customer:customer,

mobile:
document
.getElementById("customerMobile")
.value
.trim(),

address:
document
.getElementById("siteAddress")
.value
.trim(),

items:items,

labour:labour,

discount:discount,

total:total

};



const estimates=
JSON.parse(
localStorage.getItem(
"psw_estimates"
)||"[]"
);



estimates.push(estimate);



localStorage.setItem(
"psw_estimates",
JSON.stringify(estimates)
);



/* Clear selected package */

localStorage.removeItem(
"psw_selected_package"
);



alert(
"Estimate saved successfully!\n\n"+
estimate.estimateNo
);



location.href="history.html";

}



/* =========================
   PRINT
========================= */

function printEstimate(){

window.print();

}



/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}



/* =========================
   PACKAGE AUTO LOAD
========================= */

function loadSelectedPackage(){

const packageName=
localStorage.getItem(
"psw_selected_package"
);


if(packageName){

const notice=
document.getElementById(
"packageNotice"
);


notice.style.display="block";


notice.innerHTML=
`
<i class="fa-solid fa-box"></i>
<strong>${escapeHTML(packageName)}</strong>
 selected. You can edit the item and rate below.
`;


addItem(
packageName,
1,
0
);


}

else{

addItem();

}

}



/* START */

loadSelectedPackage();


</script>


</body>

</html>
