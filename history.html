<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">

<title>History | Parbez Smart Works</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="style.css">

<style>

.page-container{
  max-width:900px;
  margin:auto;
  padding:18px;
}

.page-title{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}

.back-btn{
  width:42px;
  height:42px;
  border:0;
  border-radius:13px;
  background:white;
  color:#2563eb;
  font-size:17px;
  cursor:pointer;
}

.tabs{
  display:flex;
  background:white;
  border:1px solid #e2e8f0;
  border-radius:13px;
  padding:4px;
  margin-bottom:16px;
}

.tabs button{
  flex:1;
  border:0;
  padding:11px;
  border-radius:10px;
  background:transparent;
  font-weight:bold;
  color:#64748b;
  cursor:pointer;
}

.tabs button.active{
  background:#2563eb;
  color:white;
}

.document-card{
  background:white;
  border:1px solid #e2e8f0;
  border-radius:17px;
  padding:16px;
  margin-bottom:12px;
}

.doc-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.doc-number{
  font-size:13px;
  font-weight:bold;
  color:#2563eb;
}

.doc-date{
  font-size:11px;
  color:#64748b;
}

.customer{
  font-size:16px;
  font-weight:bold;
  margin-top:10px;
}

.amount{
  font-size:19px;
  font-weight:bold;
  margin-top:5px;
}

.status{
  display:inline-block;
  margin-top:8px;
  padding:5px 9px;
  border-radius:8px;
  font-size:10px;
  font-weight:bold;
}

.paid{
  background:#dcfce7;
  color:#15803d;
}

.partial{
  background:#fef3c7;
  color:#b45309;
}

.unpaid{
  background:#fee2e2;
  color:#dc2626;
}

.estimate-status{
  background:#dbeafe;
  color:#2563eb;
}

.doc-actions{
  display:flex;
  gap:8px;
  margin-top:13px;
}

.doc-actions button{
  flex:1;
  border:0;
  padding:10px;
  border-radius:9px;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
}

.view{
  background:#eff6ff;
  color:#2563eb;
}

.delete{
  background:#fee2e2;
  color:#dc2626;
}

.empty{
  text-align:center;
  background:white;
  border:1px solid #e2e8f0;
  border-radius:18px;
  padding:40px 20px;
  color:#64748b;
}

.empty i{
  font-size:35px;
  margin-bottom:12px;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.55);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:200;
  padding:15px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:600px;
  max-height:85vh;
  overflow:auto;
  background:white;
  border-radius:22px;
  padding:20px;
}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.close-btn{
  width:38px;
  height:38px;
  border:0;
  border-radius:10px;
  background:#fee2e2;
  color:#dc2626;
  cursor:pointer;
}

.detail-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:10px 0;
  border-bottom:1px solid #e2e8f0;
  font-size:13px;
}

.detail-row span{
  color:#64748b;
}

.detail-row strong{
  text-align:right;
}

.item-table{
  margin-top:15px;
  border:1px solid #e2e8f0;
  border-radius:13px;
  overflow:hidden;
}

.item-row{
  display:grid;
  grid-template-columns:1fr 50px 85px;
  gap:5px;
  padding:10px;
  font-size:12px;
  border-bottom:1px solid #e2e8f0;
}

.item-row:last-child{
  border-bottom:0;
}

.item-row.header{
  background:#f8fafc;
  font-weight:bold;
}

.modal-total{
  margin-top:15px;
  background:#eff6ff;
  padding:15px;
  border-radius:13px;
  text-align:center;
}

.modal-total span{
  display:block;
  color:#64748b;
  font-size:12px;
}

.modal-total strong{
  display:block;
  color:#2563eb;
  font-size:23px;
  margin-top:4px;
}

@media(min-width:700px){
  .modal{
    align-items:center;
  }
}

</style>
</head>

<body>

<header class="topbar">

<div class="brand">

<div class="brand-logo">
<i class="fa-solid fa-bolt"></i>
</div>

<div>
<h1>Parbez Smart Works</h1>
<p>Electrical • Ceiling • Plumbing</p>
</div>

</div>

</header>


<main class="page-container">

<div class="page-title">

<button class="back-btn"
onclick="location.href='index.html'">

<i class="fa-solid fa-arrow-left"></i>

</button>

<h2>History</h2>

</div>


<div class="tabs">

<button id="estimateTab"
class="active"
onclick="showHistory('estimates')">

<i class="fa-solid fa-file-invoice"></i>
Estimates

</button>

<button id="billTab"
onclick="showHistory('bills')">

<i class="fa-solid fa-receipt"></i>
Bills

</button>

</div>


<div id="historyList"></div>

</main>


<!-- VIEW MODAL -->

<div id="viewModal" class="modal"
onclick="closeModalOutside(event)">

<div class="modal-box">

<div class="modal-header">

<h3 id="modalTitle">
Document Details
</h3>

<button class="close-btn"
onclick="closeModal()">

<i class="fa-solid fa-xmark"></i>

</button>

</div>

<div id="modalContent"></div>

</div>

</div>


<script>

let currentType="estimates";


function getData(type){

try{

if(type==="estimates"){

return JSON.parse(
localStorage.getItem("psw_estimates") || "[]"
);

}

return JSON.parse(
localStorage.getItem("psw_bills") || "[]"
);

}catch(error){

return [];

}

}


function showHistory(type){

currentType=type;

document
.getElementById("estimateTab")
.classList.toggle(
"active",
type==="estimates"
);

document
.getElementById("billTab")
.classList.toggle(
"active",
type==="bills"
);

renderHistory();

}


function renderHistory(){

const list=
document.getElementById("historyList");

const data=getData(currentType);


if(!data.length){

list.innerHTML=`

<div class="empty">

<i class="fa-solid fa-folder-open"></i>

<h3>No ${currentType} found</h3>

<p style="font-size:12px;margin-top:6px;">
Saved ${currentType} will appear here.
</p>

</div>

`;

return;

}


list.innerHTML=
data
.slice()
.reverse()
.map(doc=>{

const isBill=
currentType==="bills";

const number=
isBill
?doc.billNo
:doc.estimateNo;

const status=
isBill
?(doc.status || "Unpaid")
:"Estimate";


let statusClass="";

if(status==="Paid")
statusClass="paid";

else if(status==="Partial")
statusClass="partial";

else if(status==="Unpaid")
statusClass="unpaid";

else
statusClass="estimate-status";


return `

<div class="document-card">

<div class="doc-top">

<div class="doc-number">
${escapeHTML(number || "Document")}
</div>

<div class="doc-date">
${escapeHTML(doc.date || "")}
</div>

</div>


<div class="customer">
${escapeHTML(doc.customer || "Unknown Customer")}
</div>


<div class="amount">
₹${Number(doc.total || 0)
.toLocaleString("en-IN")}
</div>


<span class="status ${statusClass}">
${escapeHTML(status)}
</span>


<div class="doc-actions">

<button class="view"
onclick="viewDocument(${Number(doc.id)})">

<i class="fa-solid fa-eye"></i>
View

</button>


<button class="delete"
onclick="deleteDocument(${Number(doc.id)})">

<i class="fa-solid fa-trash"></i>
Delete

</button>

</div>

</div>

`;

})
.join("");

}


function viewDocument(id){

const data=getData(currentType);

const doc=data.find(
item=>Number(item.id)===Number(id)
);

if(!doc)return;


const modal=
document.getElementById("viewModal");

const content=
document.getElementById("modalContent");

const isBill=
currentType==="bills";

const number=
isBill
?doc.billNo
:doc.estimateNo;


document.getElementById("modalTitle")
.textContent=
isBill
?"Bill Details"
:"Estimate Details";


let itemsHTML="";


if(Array.isArray(doc.items) && doc.items.length){

itemsHTML=`

<div class="item-table">

<div class="item-row header">

<span>Work / Item</span>
<span>Qty</span>
<span>Amount</span>

</div>

${doc.items.map(item=>`

<div class="item-row">

<span>
${escapeHTML(item.name || "-")}
</span>

<span>
${Number(item.qty || 0)}
</span>

<span>
₹${Number(item.amount || 0)
.toLocaleString("en-IN")}
</span>

</div>

`).join("")}

</div>

`;

}


content.innerHTML=`

<div class="detail-row">
<span>Document No.</span>
<strong>${escapeHTML(number || "-")}</strong>
</div>

<div class="detail-row">
<span>Date</span>
<strong>${escapeHTML(doc.date || "-")}</strong>
</div>

<div class="detail-row">
<span>Customer</span>
<strong>${escapeHTML(doc.customer || "-")}</strong>
</div>

<div class="detail-row">
<span>Mobile</span>
<strong>${escapeHTML(doc.mobile || "-")}</strong>
</div>

<div class="detail-row">
<span>Address</span>
<strong>${escapeHTML(doc.address || "-")}</strong>
</div>

${itemsHTML}

${isBill ? `

<div class="detail-row">
<span>Labour</span>
<strong>
₹${Number(doc.labour || 0)
.toLocaleString("en-IN")}
</strong>
</div>

<div class="detail-row">
<span>Discount</span>
<strong>
₹${Number(doc.discount || 0)
.toLocaleString("en-IN")}
</strong>
</div>

<div class="detail-row">
<span>Paid</span>
<strong>
₹${Number(doc.paid || 0)
.toLocaleString("en-IN")}
</strong>
</div>

<div class="detail-row">
<span>Due</span>
<strong>
₹${Number(doc.due || 0)
.toLocaleString("en-IN")}
</strong>
</div>

<div class="detail-row">
<span>Status</span>
<strong>
${escapeHTML(doc.status || "-")}
</strong>
</div>

<div class="detail-row">
<span>Notes</span>
<strong>
${escapeHTML(doc.notes || "-")}
</strong>
</div>

` : `

<div class="detail-row">
<span>Labour</span>
<strong>
₹${Number(doc.labour || 0)
.toLocaleString("en-IN")}
</strong>
</div>

<div class="detail-row">
<span>Discount</span>
<strong>
₹${Number(doc.discount || 0)
.toLocaleString("en-IN")}
</strong>
</div>

`}

<div class="modal-total">

<span>Total Amount</span>

<strong>
₹${Number(doc.total || 0)
.toLocaleString("en-IN")}
</strong>

</div>

`;


modal.classList.add("show");

}


function closeModal(){

document
.getElementById("viewModal")
.classList.remove("show");

}


function closeModalOutside(event){

if(event.target.id==="viewModal"){

closeModal();

}

}


function deleteDocument(id){

if(!confirm(
"Delete this document permanently?"
))return;


let data=getData(currentType);

data=data.filter(
item=>Number(item.id)!==Number(id)
);


localStorage.setItem(

currentType==="bills"
?"psw_bills"
:"psw_estimates",

JSON.stringify(data)

);


renderHistory();

}


function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


showHistory("estimates");

</script>

</body>
</html>
