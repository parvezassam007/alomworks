<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">

<title>Create Bill | Parbez Smart Works</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="style.css">

<style>
.page-container{
  max-width:850px;
  margin:auto;
  padding:18px;
}

.page-title{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}

.back-btn{
  width:42px;
  height:42px;
  border:0;
  border-radius:13px;
  background:white;
  color:#2563eb;
  font-size:17px;
  cursor:pointer;
}

.form-card{
  background:white;
  border:1px solid #e2e8f0;
  border-radius:20px;
  padding:18px;
  margin-bottom:18px;
}

.form-card h3{
  font-size:16px;
  margin-bottom:15px;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:bold;
  margin-bottom:6px;
}

.field input,
.field textarea{
  width:100%;
  padding:13px;
  border:1px solid #dbe2ea;
  border-radius:11px;
  background:#f8fafc;
  outline:none;
  font-size:14px;
}

.field textarea{
  min-height:80px;
  resize:vertical;
}

.item{
  border:1px solid #dbe2ea;
  border-radius:15px;
  padding:13px;
  margin-bottom:12px;
  background:#f8fafc;
}

.item-grid{
  display:grid;
  grid-template-columns:minmax(0,1fr) 65px 90px;
  gap:8px;
}

.item input{
  width:100%;
  min-width:0;
  padding:11px;
  border:1px solid #dbe2ea;
  border-radius:10px;
  outline:none;
  background:white;
}

.item-total{
  display:flex;
  justify-content:space-between;
  margin-top:9px;
  font-size:13px;
  font-weight:bold;
}

.delete-item{
  margin-top:9px;
  border:0;
  background:#fee2e2;
  color:#dc2626;
  padding:8px 11px;
  border-radius:9px;
  cursor:pointer;
}

.add-btn,
.primary,
.whatsapp,
.png-btn{
  width:100%;
  border:0;
  padding:13px;
  border-radius:11px;
  font-weight:bold;
  cursor:pointer;
}

.add-btn{
  border:1px dashed #2563eb;
  background:#eff6ff;
  color:#2563eb;
}

.primary{
  background:#2563eb;
  color:white;
  margin-top:15px;
}

.whatsapp{
  background:#22c55e;
  color:white;
  margin-top:10px;
}

.png-btn{
  background:#f3e8ff;
  color:#7e22ce;
  margin-top:10px;
}

.summary{
  margin-top:18px;
  padding:15px;
  background:#f8fafc;
  border-radius:15px;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
  font-size:14px;
}

.summary-row.total{
  border-top:1px solid #e2e8f0;
  padding-top:12px;
  font-size:19px;
  font-weight:bold;
}

.bill-preview{
  background:white;
  border:1px solid #dbe2ea;
  padding:22px;
  border-radius:15px;
  margin-top:18px;
}

.bill-head{
  text-align:center;
  border-bottom:2px solid #2563eb;
  padding-bottom:15px;
  margin-bottom:15px;
}

.bill-head h2{
  color:#2563eb;
}

.bill-head p{
  font-size:12px;
  color:#64748b;
  margin-top:4px;
}

.company-about{
  font-size:11px;
  color:#64748b;
  line-height:1.5;
  margin-top:8px;
}

.bill-info{
  display:flex;
  justify-content:space-between;
  gap:15px;
  font-size:12px;
  margin-bottom:15px;
}

.customer-info{
  font-size:12px;
  margin-bottom:15px;
  line-height:1.7;
}

.bill-table{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}

.bill-table th,
.bill-table td{
  border-bottom:1px solid #e2e8f0;
  padding:9px 5px;
  text-align:left;
}

.bill-table th:nth-child(n+2),
.bill-table td:nth-child(n+2){
  text-align:right;
}

.bill-total{
  text-align:right;
  font-size:20px;
  font-weight:bold;
  color:#2563eb;
  margin-top:15px;
}

.preview-payment{
  margin-top:15px;
  border-top:1px solid #e2e8f0;
  padding-top:12px;
  font-size:12px;
  line-height:1.8;
}

.preview-notes{
  margin-top:15px;
  padding:12px;
  background:#f8fafc;
  border-left:3px solid #2563eb;
  border-radius:8px;
  font-size:11px;
  line-height:1.6;
  white-space:pre-wrap;
}

.contact-box{
  margin-top:18px;
  padding-top:13px;
  border-top:1px solid #e2e8f0;
  font-size:11px;
  color:#475569;
  line-height:1.7;
}

@media(max-width:500px){
  .item-grid{
    grid-template-columns:minmax(0,1fr) 55px 80px;
  }

  .bill-info{
    flex-direction:column;
    gap:5px;
  }
}
</style>
</head>

<body>

<header class="topbar">

<div class="brand">

<div class="brand-logo">
<i class="fa-solid fa-bolt"></i>
</div>

<div>
<h1>Parbez Smart Works</h1>
<p>Electrical • Ceiling • Plumbing</p>
</div>

</div>

</header>


<main class="page-container">

<div class="page-title">

<button class="back-btn"
onclick="location.href='index.html'">

<i class="fa-solid fa-arrow-left"></i>

</button>

<h2>Create Work Bill</h2>

</div>


<!-- CUSTOMER -->

<div class="form-card">

<h3>Customer Details</h3>

<div class="field">

<label>Customer Name</label>

<input
id="customerName"
type="text"
placeholder="Enter customer name">

</div>


<div class="field">

<label>Customer Mobile Number</label>

<input
id="customerMobile"
type="tel"
maxlength="10"
inputmode="numeric"
placeholder="10 digit customer number">

</div>


<div class="field">

<label>Site Address</label>

<textarea
id="siteAddress"
placeholder="Enter site address"></textarea>

</div>

</div>


<!-- ITEMS -->

<div class="form-card">

<h3>Work / Items</h3>

<div id="items"></div>

<button
type="button"
class="add-btn"
id="addItemButton">

<i class="fa-solid fa-plus"></i>
Add Item

</button>

</div>


<!-- PAYMENT -->

<div class="form-card">

<h3>Payment Details</h3>

<div class="field">

<label>Paid Amount</label>

<input
id="paid"
type="number"
min="0"
value="0">

</div>


<div class="field">

<label>Discount</label>

<input
id="discount"
type="number"
min="0"
value="0">

</div>


<div class="summary">

<div class="summary-row">
<span>Items Total</span>
<strong id="itemsTotal">₹0</strong>
</div>
