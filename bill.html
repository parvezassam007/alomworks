<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">

<title>Create Bill | Parbez Smart Works</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="style.css">

<style>

.page-container{
  max-width:850px;
  margin:auto;
  padding:18px;
}

.page-title{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}

.back-btn{
  width:42px;
  height:42px;
  border:0;
  border-radius:13px;
  background:white;
  color:#2563eb;
  font-size:17px;
  cursor:pointer;
}

.form-card{
  background:white;
  border:1px solid #e2e8f0;
  border-radius:20px;
  padding:18px;
  margin-bottom:18px;
}

.form-card h3{
  font-size:16px;
  margin-bottom:15px;
}

.bill-info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:18px;
}

.info-box{
  background:#eff6ff;
  border-radius:12px;
  padding:12px;
}

.info-box span{
  display:block;
  color:#64748b;
  font-size:10px;
}

.info-box strong{
  display:block;
  color:#2563eb;
  margin-top:4px;
  font-size:14px;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:600;
  margin-bottom:6px;
}

.field input,
.field textarea,
.item input{
  width:100%;
  border:1px solid #dbe2ea;
  border-radius:11px;
  padding:12px;
  outline:none;
  font-size:14px;
  background:#f8fafc;
}

.field textarea{
  min-height:75px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus,
.item input:focus{
  border-color:#2563eb;
  background:white;
}

.item{
  border:1px solid #e2e8f0;
  border-radius:15px;
  padding:13px;
  margin-bottom:12px;
  background:#f8fafc;
}

.item-grid{
  display:grid;
  grid-template-columns:1fr 75px 95px;
  gap:8px;
}

.item-total{
  margin-top:10px;
  display:flex;
  justify-content:space-between;
  font-size:13px;
  font-weight:bold;
}

.delete-item{
  margin-top:9px;
  border:0;
  background:#fee2e2;
  color:#dc2626;
  padding:8px 12px;
  border-radius:9px;
  cursor:pointer;
  font-size:12px;
}

.add-btn{
  width:100%;
  border:1px dashed #2563eb;
  color:#2563eb;
  background:#eff6ff;
  padding:12px;
  border-radius:11px;
  font-weight:bold;
  cursor:pointer;
}

.summary{
  margin-top:18px;
  background:#f8fafc;
  border-radius:15px;
  padding:15px;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
  font-size:14px;
}

.summary-row.total{
  border-top:1px solid #e2e8f0;
  padding-top:13px;
  font-size:19px;
  font-weight:bold;
}

.due-box{
  margin-top:12px;
  padding:14px;
  background:#fff7ed;
  border-radius:13px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.due-box span{
  color:#9a3412;
  font-size:13px;
}

.due-box strong{
  color:#ea580c;
  font-size:19px;
}

.status-box{
  padding:12px;
  border-radius:11px;
  background:#f8fafc;
  margin-top:12px;
  text-align:center;
  font-weight:bold;
}

.status-paid{
  color:#15803d;
  background:#dcfce7;
}

.status-partial{
  color:#b45309;
  background:#fef3c7;
}

.status-unpaid{
  color:#dc2626;
  background:#fee2e2;
}

.primary{
  width:100%;
  border:0;
  background:#2563eb;
  color:white;
  padding:14px;
  border-radius:12px;
  margin-top:16px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.secondary{
  width:100%;
  border:0;
  background:#dcfce7;
  color:#15803d;
  padding:13px;
  border-radius:12px;
  margin-top:10px;
  font-weight:bold;
  cursor:pointer;
}

.whatsapp{
  width:100%;
  border:0;
  background:#25d366;
  color:white;
  padding:13px;
  border-radius:12px;
  margin-top:10px;
  font-weight:bold;
  cursor:pointer;
}

@media(max-width:500px){

  .item-grid{
    grid-template-columns:1fr 65px 85px;
  }

  .bill-info{
    grid-template-columns:1fr 1fr;
  }

}

@media print{

  .topbar,
  .back-btn,
  .add-btn,
  .delete-item,
  .primary,
  .secondary,
  .whatsapp{
    display:none !important;
  }

  body{
    background:white;
    padding:0;
  }

  .page-container{
    max-width:none;
    padding:10px;
  }

  .form-card{
    border:1px solid #ccc;
    box-shadow:none;
  }

}

</style>

</head>


<body>


<header class="topbar">

<div class="brand">

<div class="brand-logo">
<i class="fa-solid fa-bolt"></i>
</div>

<div>

<h1>Parbez Smart Works</h1>

<p>
Electrical • Ceiling • Plumbing
</p>

</div>

</div>

</header>



<main class="page-container">


<div class="page-title">

<button
class="back-btn"
onclick="location.href='index.html'">

<i class="fa-solid fa-arrow-left"></i>

</button>

<h2>Create Work Bill</h2>

</div>



<!-- BILL INFORMATION -->

<div class="form-card">

<h3>Bill Information</h3>

<div class="bill-info">

<div class="info-box">

<span>Bill Number</span>

<strong id="billNumber">
PSW-0001
</strong>

</div>


<div class="info-box">

<span>Date</span>

<strong id="billDate">
-
</strong>

</div>

</div>


<!-- CUSTOMER -->

<div class="field">

<label>
Customer Name
</label>

<input
id="customerName"
type="text"
placeholder="Enter customer name">

</div>


<div class="field">

<label>
Mobile Number
</label>

<input
id="customerMobile"
type="tel"
maxlength="10"
inputmode="numeric"
placeholder="10 digit mobile number">

</div>


<div class="field">

<label>
Site Address
</label>

<textarea
id="siteAddress"
placeholder="Enter site address"></textarea>

</div>

</div>



<!-- ITEMS -->

<div class="form-card">

<h3>
Work / Items
</h3>


<div id="items"></div>


<button
class="add-btn"
onclick="addItem()">

<i class="fa-solid fa-plus"></i>

Add Item

</button>

</div>



<!-- PAYMENT -->

<div class="form-card">

<h3>
Payment Details
</h3>


<div class="field">

<label>
Labour Charge
</label>

<input
id="labour"
type="number"
min="0"
value="0"
oninput="calculateTotal()">

</div>


<div class="field">

<label>
Discount
</label>

<input
id="discount"
type="number"
min="0"
value="0"
oninput="calculateTotal()">

</div>


<div class="field">

<label>
Paid Amount
</label>

<input
id="paid"
type="number"
min="0"
value="0"
oninput="calculateTotal()">

</div>


<div class="summary">

<div class="summary-row">

<span>
Items Total
</span>

<strong id="itemsTotal">
₹0
</strong>

</div>


<div class="summary-row">

<span>
Labour
</span>

<strong id="labourTotal">
₹0
</strong>

</div>


<div class="summary-row">

<span>
Discount
</span>

<strong id="discountTotal">
₹0
</strong>

</div>


<div class="summary-row total">

<span>
Grand Total
</span>

<strong id="grandTotal">
₹0
</strong>

</div>

</div>



<div class="due-box">

<span>
Amount Due
</span>

<strong id="dueTotal">
₹0
</strong>

</div>


<div
id="statusBox"
class="status-box status-unpaid">

Unpaid

</div>



<div class="field" style="margin-top:14px;">

<label>
Notes
</label>

<textarea
id="notes"
placeholder="Payment note, work note, warranty note etc."></textarea>

</div>



<button
class="primary"
onclick="saveBill()">

<i class="fa-solid fa-floppy-disk"></i>

Save Bill

</button>


<button
class="secondary"
onclick="printBill()">

<i class="fa-solid fa-print"></i>

Print / PDF

</button>


<button
class="whatsapp"
onclick="sendWhatsApp()">

<i class="fa-brands fa-whatsapp"></i>

Send Bill on WhatsApp

</button>


</div>


</main>



<script>


let itemNumber=0;

let billSaved=false;



/* =========================
   BILL NUMBER
========================= */

function getNextBillNumber(){

let number=
Number(
localStorage.getItem(
"psw_bill_number"
)
)||1;


return "PSW-"+
String(number)
.padStart(4,"0");

}



function increaseBillNumber(){

let number=
Number(
localStorage.getItem(
"psw_bill_number"
)
)||1;


localStorage.setItem(
"psw_bill_number",
number+1
);

}



/* =========================
   TODAY
========================= */

function getToday(){

return new Date()
.toLocaleDateString(
"en-IN",
{
day:"2-digit",
month:"2-digit",
year:"numeric"
}
);

}



/* =========================
   ADD ITEM
========================= */

function addItem(
name="",
qty=1,
rate=0
){

itemNumber++;


const container=
document.getElementById(
"items"
);


const div=
document.createElement("div");


div.className="item";

div.dataset.id=itemNumber;


div.innerHTML=`

<div class="item-grid">

<input
class="item-name"
type="text"
placeholder="Item / Work"
value="${escapeHTML(name)}">

<input
class="item-qty"
type="number"
min="1"
value="${qty}"
oninput="calculateTotal()">

<input
class="item-rate"
type="number"
min="0"
value="${rate}"
oninput="calculateTotal()">

</div>


<div class="item-total">

<span>
Item Total
</span>

<span class="row-total">
₹0
</span>

</div>


<button
class="delete-item"
onclick="removeItem(this)">

<i class="fa-solid fa-trash"></i>

Remove

</button>

`;


container.appendChild(div);


calculateTotal();

}



/* =========================
   REMOVE ITEM
========================= */

function removeItem(button){

button
.closest(".item")
.remove();


calculateTotal();

}



/* =========================
   CALCULATE
========================= */

function calculateTotal(){

let total=0;


document
.querySelectorAll(".item")
.forEach(item=>{

const qty=
Number(
item.querySelector(
".item-qty"
).value
)||0;


const rate=
Number(
item.querySelector(
".item-rate"
).value
)||0;


const amount=
qty*rate;


total+=amount;


item.querySelector(
".row-total"
).textContent=
"₹"+
amount.toLocaleString(
"en-IN"
);

});



const labour=
Number(
document.getElementById(
"labour"
).value
)||0;


const discount=
Number(
document.getElementById(
"discount"
).value
)||0;


let paid=
Number(
document.getElementById(
"paid"
).value
)||0;


const grand=
Math.max(
0,
total+labour-discount
);


/* Paid cannot be greater than total */

if(paid>grand){

paid=grand;

document.getElementById(
"paid"
).value=paid;

}


const due=
Math.max(
0,
grand-paid
);



document.getElementById(
"itemsTotal"
).textContent=
"₹"+
total.toLocaleString(
"en-IN"
);


document.getElementById(
"labourTotal"
).textContent=
"₹"+
labour.toLocaleString(
"en-IN"
);


document.getElementById(
"discountTotal"
).textContent=
"₹"+
discount.toLocaleString(
"en-IN"
);


document.getElementById(
"grandTotal"
).textContent=
"₹"+
grand.toLocaleString(
"en-IN"
);


document.getElementById(
"dueTotal"
).textContent=
"₹"+
due.toLocaleString(
"en-IN"
);



const statusBox=
document.getElementById(
"statusBox"
);


statusBox.className=
"status-box";


if(grand<=0){

statusBox.classList.add(
"status-unpaid"
);

statusBox.textContent=
"Unpaid";

}

else if(due<=0){

statusBox.classList.add(
"status-paid"
);

statusBox.textContent=
"Paid";

}

else if(paid>0){

statusBox.classList.add(
"status-partial"
);

statusBox.textContent=
"Partial";

}

else{

statusBox.classList.add(
"status-unpaid"
);

statusBox.textContent=
"Unpaid";

}

}



/* =========================
   SAVE BILL
========================= */

function saveBill(){

if(billSaved){

alert(
"This bill is already saved."
);

return;

}


const customer=
document
.getElementById(
"customerName"
)
.value
.trim();


if(!customer){

alert(
"Please enter customer name."
);

return;

}



const mobile=
document
.getElementById(
"customerMobile"
)
.value
.trim();


if(
mobile &&
!/^[0-9]{10}$/.test(mobile)
){

alert(
"Please enter a valid 10 digit mobile number."
);

return;

}



const items=[];


document
.querySelectorAll(".item")
.forEach(item=>{

const name=
item
.querySelector(
".item-name"
)
.value
.trim();


const qty=
Number(
item
.querySelector(
".item-qty"
).value
)||0;


const rate=
Number(
item
.querySelector(
".item-rate"
).value
)||0;


if(name){

items.push({

name:name,

qty:qty,

rate:rate,

amount:qty*rate

});

}

});



if(!items.length){

alert(
"Please add at least one work item."
);

return;

}



const itemsTotal=
items.reduce(
(sum,item)=>
sum+item.amount,
0
);


const labour=
Number(
document.getElementById(
"labour"
).value
)||0;


const discount=
Number(
document.getElementById(
"discount"
).value
)||0;


const total=
Math.max(
0,
itemsTotal+labour-discount
);


const paid=
Math.min(
Number(
document.getElementById(
"paid"
).value
)||0,
total
);


const due=
Math.max(
0,
total-paid
);


let status=
"Unpaid";


if(total>0 && due<=0){

status="Paid";

}

else if(paid>0){

status="Partial";

}



const bill={

id:Date.now(),

billNo:
document.getElementById(
"billNumber"
).textContent,

date:
document.getElementById(
"billDate"
).textContent,

customer:customer,

mobile:mobile,

address:
document.getElementById(
"siteAddress"
).value.trim(),

items:items,

labour:labour,

discount:discount,

total:total,

paid:paid,

due:due,

status:status,

notes:
document.getElementById(
"notes"
).value.trim()

};



const bills=
JSON.parse(
localStorage.getItem(
"psw_bills"
)||"[]"
);


bills.push(bill);


localStorage.setItem(
"psw_bills",
JSON.stringify(bills)
);


increaseBillNumber();


billSaved=true;


alert(
"Bill saved successfully!\n\n"+
bill.billNo
);


location.href=
"history.html";

}



/* =========================
   PRINT
========================= */

function printBill(){

window.print();

}



/* =========================
   WHATSAPP
========================= */

function sendWhatsApp(){

const mobile=
document
.getElementById(
"customerMobile"
)
.value
.trim();


if(
!/^[0-9]{10}$/.test(mobile)
){

alert(
"Enter customer's 10 digit mobile number first."
);

return;

}



const customer=
document
.getElementById(
"customerName"
)
.value
.trim() ||
"Customer";


const billNo=
document
.getElementById(
"billNumber"
)
.textContent;


const date=
document
.getElementById(
"billDate"
)
.textContent;



let message=
`*Parbez Smart Works*

Bill No: ${billNo}
Date: ${date}

Customer: ${customer}

Work / Items:
`;



document
.querySelectorAll(".item")
.forEach(item=>{

const name=
item
.querySelector(
".item-name"
)
.value
.trim();


const qty=
Number(
item
.querySelector(
".item-qty"
).value
)||0;


const rate=
Number(
item
.querySelector(
".item-rate"
).value
)||0;


if(name){

message+=
`\n• ${name} × ${qty} = ₹${(
qty*rate
).toLocaleString("en-IN")}`;

}

});



const itemsTotal=
calculateItemsOnly();


const labour=
Number(
document.getElementById(
"labour"
).value
)||0;


const discount=
Number(
document.getElementById(
"discount"
).value
)||0;


const total=
Math.max(
0,
itemsTotal+labour-discount
);


const paid=
Math.min(
Number(
document.getElementById(
"paid"
).value
)||0,
total
);


const due=
Math.max(
0,
total-paid
);


message+=`

Items Total: ₹${itemsTotal.toLocaleString("en-IN")}
Labour: ₹${labour.toLocaleString("en-IN")}
Discount: ₹${discount.toLocaleString("en-IN")}

*Grand Total: ₹${total.toLocaleString("en-IN")}*

Paid: ₹${paid.toLocaleString("en-IN")}
Due: ₹${due.toLocaleString("en-IN")}

Status: ${getStatus(total,paid)}
`;



const notes=
document
.getElementById(
"notes"
)
.value
.trim();


if(notes){

message+=
`\n\nNotes: ${notes}`;

}



message+=
`\n\nThank you for choosing Parbez Smart Works.`;



const url=
"https://wa.me/91"+
mobile+
"?text="+
encodeURIComponent(message);


window.open(
url,
"_blank"
);

}



/* =========================
   ITEMS TOTAL
========================= */

function calculateItemsOnly(){

let total=0;


document
.querySelectorAll(".item")
.forEach(item=>{

const qty=
Number(
item.querySelector(
".item-qty"
).value
)||0;


const rate=
Number(
item.querySelector(
".item-rate"
).value
)||0;


total+=qty*rate;

});


return total;

}



/* =========================
   STATUS
========================= */

function getStatus(
total,
paid
){

const due=
Math.max(
0,
total-paid
);


if(total<=0){

return "Unpaid";

}


if(due<=0){

return "Paid";

}


if(paid>0){

return "Partial";

}


return "Unpaid";

}



/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}



/* =========================
   START
========================= */

document.getElementById(
"billNumber"
).textContent=
getNextBillNumber();


document.getElementById(
"billDate"
).textContent=
getToday();


addItem();


calculateTotal();


</script>


</body>

</html>
