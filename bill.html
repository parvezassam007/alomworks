<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

  <meta name="theme-color"
    content="#2563eb">

  <title>Work Bill | Parbez Smart Works</title>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <link rel="stylesheet"
    href="style.css">

  <style>

    .page-container {
      max-width: 850px;
      margin: auto;
      padding: 18px;
    }

    .page-title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .back-btn {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 13px;
      background: white;
      color: #2563eb;
      font-size: 17px;
    }

    .page-title h2 {
      font-size: 21px;
    }

    .bill-info {
      background: linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
      );

      color: white;

      padding: 20px;

      border-radius: 20px;

      display: flex;
      justify-content: space-between;

      margin-bottom: 18px;
    }

    .bill-info span {
      display: block;
      font-size: 11px;
      opacity: .8;
      margin-bottom: 5px;
    }

    .bill-info strong {
      font-size: 16px;
    }

    .form-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .form-card h3 {
      font-size: 16px;
      margin-bottom: 15px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .field input,
    .field textarea,
    .field select,
    .item input {
      width: 100%;
      border: 1px solid #dbe2ea;
      border-radius: 11px;
      padding: 12px;
      outline: none;
      font-size: 14px;
      background: #f8fafc;
    }

    .field textarea {
      min-height: 75px;
      resize: vertical;
    }

    .item {
      border: 1px solid #e2e8f0;
      border-radius: 15px;
      padding: 13px;
      margin-bottom: 12px;
      background: #f8fafc;
    }

    .item-grid {
      display: grid;
      grid-template-columns: 1fr 75px 95px;
      gap: 8px;
    }

    .item-total {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: bold;
    }

    .delete-item {
      margin-top: 9px;
      border: 0;
      background: #fee2e2;
      color: #dc2626;
      padding: 8px 12px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 12px;
    }

    .add-btn {
      width: 100%;
      border: 1px dashed #2563eb;
      color: #2563eb;
      background: #eff6ff;
      padding: 12px;
      border-radius: 11px;
      font-weight: bold;
    }

    .summary {
      background: #f8fafc;
      border-radius: 15px;
      padding: 15px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .summary-row.total {
      border-top: 1px solid #e2e8f0;
      padding-top: 13px;
      font-size: 19px;
      font-weight: bold;
    }

    .primary,
    .whatsapp,
    .print {
      width: 100%;
      border: 0;
      padding: 14px;
      border-radius: 12px;
      margin-top: 11px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .whatsapp {
      background: #22c55e;
      color: white;
    }

    .print {
      background: #e2e8f0;
      color: #1e293b;
    }

  </style>

</head>

<body>


<header class="topbar">

  <div class="brand">

    <div class="brand-logo">
      <i class="fa-solid fa-bolt"></i>
    </div>

    <div>

      <h1>Parbez Smart Works</h1>

      <p>
        Electrical • Ceiling • Plumbing
      </p>

    </div>

  </div>

</header>


<main class="page-container">


  <div class="page-title">

    <button class="back-btn"
      onclick="location.href='index.html'">

      <i class="fa-solid fa-arrow-left"></i>

    </button>

    <h2>Create Work Bill</h2>

  </div>


  <!-- BILL INFO -->

  <div class="bill-info">

    <div>

      <span>Bill Number</span>

      <strong id="billNumber">
        PSW-0001
      </strong>

    </div>


    <div>

      <span>Date</span>

      <strong id="billDate"></strong>

    </div>

  </div>


  <!-- CUSTOMER -->

  <div class="form-card">

    <h3>Customer Details</h3>


    <div class="field">

      <label>Customer Name</label>

      <input
        id="customerName"
        type="text"
        placeholder="Enter customer name">

    </div>


    <div class="field">

      <label>Mobile Number</label>

      <input
        id="customerMobile"
        type="tel"
        maxlength="10"
        inputmode="numeric"
        placeholder="10 digit mobile number">

    </div>


    <div class="field">

      <label>Site Address</label>

      <textarea
        id="siteAddress"
        placeholder="Enter site address"></textarea>

    </div>

  </div>


  <!-- ITEMS -->

  <div class="form-card">

    <h3>Work / Items</h3>

    <div id="items"></div>


    <button class="add-btn"
      onclick="addItem()">

      <i class="fa-solid fa-plus"></i>
      Add Item

    </button>

  </div>


  <!-- PAYMENT -->

  <div class="form-card">

    <h3>Payment</h3>


    <div class="field">

      <label>Discount</label>

      <input
        id="discount"
        type="number"
        min="0"
        value="0"
        oninput="calculateBill()">

    </div>


    <div class="field">

      <label>Paid Amount</label>

      <input
        id="paid"
        type="number"
        min="0"
        value="0"
        oninput="calculateBill()">

    </div>


    <div class="field">

      <label>Payment Status</label>

      <select id="paymentStatus">

        <option value="Unpaid">
          Unpaid
        </option>

        <option value="Partial">
          Partial
        </option>

        <option value="Paid">
          Paid
        </option>

      </select>

    </div>


    <div class="field">

      <label>Notes</label>

      <textarea
        id="notes"
        placeholder="Enter notes"></textarea>

    </div>


    <div class="summary">

      <div class="summary-row">

        <span>Items Total</span>

        <strong id="itemsTotal">
          ₹0
        </strong>

      </div>


      <div class="summary-row">

        <span>Discount</span>

        <strong id="discountTotal">
          ₹0
        </strong>

      </div>


      <div class="summary-row total">

        <span>Total</span>

        <strong id="grandTotal">
          ₹0
        </strong>

      </div>


      <div class="summary-row">

        <span>Paid</span>

        <strong id="paidTotal">
          ₹0
        </strong>

      </div>


      <div class="summary-row">

        <span>Due</span>

        <strong id="dueTotal">
          ₹0
        </strong>

      </div>

    </div>


    <button class="primary"
      onclick="saveBill()">

      <i class="fa-solid fa-floppy-disk"></i>
      Save Work Bill

    </button>


    <button class="whatsapp"
      onclick="shareWhatsApp()">

      <i class="fa-brands fa-whatsapp"></i>
      Share on WhatsApp

    </button>


    <button class="print"
      onclick="window.print()">

      <i class="fa-solid fa-print"></i>
      Print / PDF

    </button>

  </div>

</main>


<script>

let itemNumber = 0;


/* BILL NUMBER */

function getBillNumber() {

  let number =
    Number(
      localStorage.getItem(
        "psw_bill_number"
      )
    ) || 1;

  return "PSW-" +
    String(number).padStart(4, "0");

}


/* DATE */

document.getElementById("billNumber")
  .textContent =
  getBillNumber();


document.getElementById("billDate")
  .textContent =
  new Date().toLocaleDateString("en-IN");


/* ADD ITEM */

function addItem() {

  itemNumber++;


  const div =
    document.createElement("div");

  div.className = "item";


  div.innerHTML = `

    <div class="item-grid">

      <input
        class="item-name"
        type="text"
        placeholder="Item / Work">

      <input
        class="item-qty"
        type="number"
        min="1"
        value="1"
        oninput="calculateBill()">

      <input
        class="item-rate"
        type="number"
        min="0"
        value="0"
        oninput="calculateBill()">

    </div>


    <div class="item-total">

      <span>Item Total</span>

      <span class="row-total">
        ₹0
      </span>

    </div>


    <button class="delete-item"
      onclick="removeItem(this)">

      <i class="fa-solid fa-trash"></i>
      Remove

    </button>

  `;


  document
    .getElementById("items")
    .appendChild(div);


  calculateBill();

}


/* REMOVE */

function removeItem(button) {

  button.closest(".item").remove();

  calculateBill();

}


/* CALCULATE */

function calculateBill() {

  let itemsTotal = 0;


  document
    .querySelectorAll(".item")
    .forEach(item => {

      const qty =
        Number(
          item.querySelector(".item-qty").value
        ) || 0;


      const rate =
        Number(
          item.querySelector(".item-rate").value
        ) || 0;


      const amount =
        qty * rate;


      itemsTotal += amount;


      item.querySelector(".row-total")
        .textContent =
        "₹" +
        amount.toLocaleString("en-IN");

    });


  const discount =
    Number(
      document.getElementById("discount").value
    ) || 0;


  const paid =
    Number(
      document.getElementById("paid").value
    ) || 0;


  const total =
    Math.max(
      0,
      itemsTotal - discount
    );


  const due =
    Math.max(
      0,
      total - paid
    );


  document.getElementById("itemsTotal")
    .textContent =
    "₹" +
    itemsTotal.toLocaleString("en-IN");


  document.getElementById("discountTotal")
    .textContent =
    "₹" +
    discount.toLocaleString("en-IN");


  document.getElementById("grandTotal")
    .textContent =
    "₹" +
    total.toLocaleString("en-IN");


  document.getElementById("paidTotal")
    .textContent =
    "₹" +
    paid.toLocaleString("en-IN");


  document.getElementById("dueTotal")
    .textContent =
    "₹" +
    due.toLocaleString("en-IN");

}


/* SAVE BILL */

function saveBill() {

  const customer =
    document.getElementById(
      "customerName"
    ).value.trim();


  if (!customer) {

    alert(
      "Please enter customer name."
    );

    return;

  }


  const items = [];


  document
    .querySelectorAll(".item")
    .forEach(item => {

      const name =
        item.querySelector(
          ".item-name"
        ).value.trim();


      const qty =
        Number(
          item.querySelector(
            ".item-qty"
          ).value
        ) || 0;


      const rate =
        Number(
          item.querySelector(
            ".item-rate"
          ).value
        ) || 0;


      if (name) {

        items.push({

          name,
          qty,
          rate,

          amount:
            qty * rate

        });

      }

    });


  const itemsTotal =
    items.reduce(
      (sum, item) =>
        sum + item.amount,
      0
    );


  const discount =
    Number(
      document.getElementById(
        "discount"
      ).value
    ) || 0;


  const paid =
    Number(
      document.getElementById(
        "paid"
      ).value
    ) || 0;


  const total =
    Math.max(
      0,
      itemsTotal - discount
    );


  const due =
    Math.max(
      0,
      total - paid
    );


  let status =
    document.getElementById(
      "paymentStatus"
    ).value;


  if (paid >= total && total > 0) {

    status = "Paid";

  }
  else if (paid > 0) {

    status = "Partial";

  }
  else {

    status = "Unpaid";

  }


  const bill = {

    id: Date.now(),

    billNo:
      document.getElementById(
        "billNumber"
      ).textContent,

    date:
      new Date().toLocaleDateString(
        "en-IN"
      ),

    customer,

    mobile:
      document.getElementById(
        "customerMobile"
      ).value.trim(),

    address:
      document.getElementById(
        "siteAddress"
      ).value.trim(),

    items,

    discount,

    total,

    paid,

    due,

    status,

    notes:
      document.getElementById(
        "notes"
      ).value.trim()

  };


  const bills =
    JSON.parse(
      localStorage.getItem(
        "psw_bills"
      ) || "[]"
    );


  bills.push(bill);


  localStorage.setItem(
    "psw_bills",
    JSON.stringify(bills)
  );


  const number =
    Number(
      localStorage.getItem(
        "psw_bill_number"
      )
    ) || 1;


  localStorage.setItem(
    "psw_bill_number",
    number + 1
  );


  alert(
    "Work Bill saved successfully!\n\n" +
    bill.billNo
  );


  location.href =
    "history.html";

}


/* WHATSAPP */

function shareWhatsApp() {

  const name =
    document.getElementById(
      "customerName"
    ).value.trim();


  const mobile =
    document.getElementById(
      "customerMobile"
    ).value.trim();


  const total =
    document.getElementById(
      "grandTotal"
    ).textContent;


  const paid =
    document.getElementById(
      "paidTotal"
    ).textContent;


  const due =
    document.getElementById(
      "dueTotal"
    ).textContent;


  let text =
`*PARBEZ SMART WORKS*

Work Bill: ${
  document.getElementById(
    "billNumber"
  ).textContent
}

Date: ${
  document.getElementById(
    "billDate"
  ).textContent
}

Customer: ${name}

Total: ${total}
Paid: ${paid}
Due: ${due}

Thank you for choosing
Parbez Smart Works.`;


  let url =
    "https://wa.me/91" +
    mobile +
    "?text=" +
    encodeURIComponent(text);


  if (
    mobile.length === 10 &&
    /^[6-9]\d{9}$/.test(mobile)
  ) {

    window.open(
      url,
      "_blank"
    );

  }
  else {

    window.open(
      "https://wa.me/?text=" +
      encodeURIComponent(text),
      "_blank"
    );

  }

}


/* FIRST ITEM */

addItem();

calculateBill();

</script>

</body>
</html>
