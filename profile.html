<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">

<title>My Profile | Parbez Smart Works</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="style.css">

<style>

.page-container{
  max-width:700px;
  margin:auto;
  padding:18px;
}

.page-title{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}

.back-btn{
  width:42px;
  height:42px;
  border:0;
  border-radius:13px;
  background:white;
  color:#2563eb;
  font-size:17px;
  cursor:pointer;
}

.profile-header{
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  color:white;
  border-radius:22px;
  padding:25px;
  text-align:center;
  margin-bottom:18px;
}

.profile-logo{
  width:75px;
  height:75px;
  margin:auto;
  border-radius:23px;
  background:rgba(255,255,255,.18);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
}

.profile-header h2{
  margin-top:12px;
  font-size:21px;
}

.profile-header p{
  margin-top:5px;
  font-size:12px;
  opacity:.85;
}

.form-card{
  background:white;
  border:1px solid #e2e8f0;
  border-radius:20px;
  padding:18px;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:bold;
  margin-bottom:6px;
}

.field input,
.field textarea{
  width:100%;
  padding:13px;
  border:1px solid #dbe2ea;
  border-radius:11px;
  background:#f8fafc;
  outline:none;
  font-size:14px;
}

.field input:focus,
.field textarea:focus{
  border-color:#2563eb;
  background:white;
}

.field textarea{
  min-height:120px;
  resize:vertical;
  line-height:1.5;
}

.save-btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#2563eb;
  color:white;
  font-weight:bold;
  font-size:14px;
  cursor:pointer;
}

.number-box{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.number-box .field{
  margin-bottom:15px;
}

.info-box{
  margin-top:15px;
  padding:12px;
  background:#eff6ff;
  color:#2563eb;
  border-radius:11px;
  font-size:11px;
  line-height:1.5;
}

@media(max-width:500px){

  .number-box{
    grid-template-columns:1fr;
    gap:0;
  }

}

</style>
</head>

<body>

<header class="topbar">

<div class="brand">

<div class="brand-logo">
<i class="fa-solid fa-bolt"></i>
</div>

<div>
<h1>Parbez Smart Works</h1>
<p>Electrical • Ceiling • Plumbing</p>
</div>

</div>

</header>


<main class="page-container">


<div class="page-title">

<button class="back-btn"
onclick="location.href='index.html'">

<i class="fa-solid fa-arrow-left"></i>

</button>

<h2>My Profile</h2>

</div>


<!-- PROFILE HEADER -->

<div class="profile-header">

<div class="profile-logo">
<i class="fa-solid fa-bolt"></i>
</div>

<h2 id="displayWorkName">
Parbez Smart Works
</h2>

<p>
Electrical • False Ceiling • Plumbing
</p>

</div>


<!-- FORM -->

<div class="form-card">

<h3 style="margin-bottom:18px;">
Business Information
</h3>


<!-- BUSINESS NAME -->

<div class="field">

<label>
<i class="fa-solid fa-building"></i>
Work / Business Name
</label>

<input
id="workName"
type="text"
value="Parbez Smart Works"
placeholder="Enter business name">

</div>


<!-- OWNER NAME -->

<div class="field">

<label>
<i class="fa-solid fa-user"></i>
Owner Name
</label>

<input
id="ownerName"
type="text"
value="Parbez Alom Badrul Alom"
placeholder="Enter owner name">

</div>


<!-- MOBILE NUMBERS -->

<div class="number-box">

<div class="field">

<label>
<i class="fa-solid fa-phone"></i>
Mobile Number 1
</label>

<input
id="mobile1"
type="tel"
maxlength="10"
inputmode="numeric"
value="9395305384"
placeholder="10 digit number">

</div>


<div class="field">

<label>
<i class="fa-solid fa-phone"></i>
Mobile Number 2
</label>

<input
id="mobile2"
type="tel"
maxlength="10"
inputmode="numeric"
value="9833762577"
placeholder="10 digit number">

</div>

</div>


<!-- LOCATION -->

<div class="field">

<label>
<i class="fa-solid fa-location-dot"></i>
Location
</label>

<input
id="location"
type="text"
value="Hojai, Assam"
placeholder="Enter location">

</div>


<!-- INSTAGRAM -->

<div class="field">

<label>
<i class="fa-brands fa-instagram"></i>
Instagram
</label>

<input
id="instagram"
type="text"
value="@parbez_works"
placeholder="@username">

</div>


<!-- YOUTUBE -->

<div class="field">

<label>
<i class="fa-brands fa-youtube"></i>
YouTube
</label>

<input
id="youtube"
type="text"
value="@parbezworks"
placeholder="@channel">

</div>


<!-- ABOUT -->

<div class="field">

<label>
<i class="fa-solid fa-circle-info"></i>
About Your Work
</label>

<textarea id="about">Parbez Smart Works is a local service business providing professional Electrical, False Ceiling and Plumbing work. We handle house wiring, lighting, fan installation, MCB/DB work, gypsum and PVC ceiling, LED lighting, plumbing, bathroom and kitchen work, leakage repair and other home improvement services.

Our goal is to provide reliable workmanship, clear estimates and quality service for residential and commercial projects in Hojai, Assam.</textarea>

</div>


<!-- SAVE -->

<button class="save-btn"
onclick="saveProfile()">

<i class="fa-solid fa-floppy-disk"></i>
Save Profile

</button>


<div class="info-box">

<i class="fa-solid fa-circle-info"></i>

Your business information will be saved on this device
and can be used automatically in Estimates, Bills and other
Parbez Smart Works documents.

</div>

</div>

</main>


<script>

/* LOAD SAVED PROFILE */

const saved =
JSON.parse(
localStorage.getItem("psw_profile") || "null"
);


if(saved){

document.getElementById("workName").value =
saved.workName || "Parbez Smart Works";

document.getElementById("ownerName").value =
saved.ownerName || "Parbez Alom Badrul Alom";

document.getElementById("mobile1").value =
saved.mobile1 || "9395305384";

document.getElementById("mobile2").value =
saved.mobile2 || "9833762577";

document.getElementById("location").value =
saved.location || "Hojai, Assam";

document.getElementById("instagram").value =
saved.instagram || "@parbez_works";

document.getElementById("youtube").value =
saved.youtube || "@parbezworks";

document.getElementById("about").value =
saved.about || "";

document.getElementById("displayWorkName").textContent =
saved.workName || "Parbez Smart Works";

}


/* SAVE PROFILE */

function saveProfile(){

const mobile1 =
document.getElementById("mobile1")
.value.replace(/\D/g,"")
.slice(0,10);

const mobile2 =
document.getElementById("mobile2")
.value.replace(/\D/g,"")
.slice(0,10);


if(
mobile1.length !== 10 ||
mobile2.length !== 10
){

alert("Please enter both 10 digit mobile numbers.");

return;

}


const profile = {

workName:
document.getElementById("workName")
.value.trim(),

ownerName:
document.getElementById("ownerName")
.value.trim(),

mobile1: mobile1,

mobile2: mobile2,

/* Compatibility with older bill/estimate code */
mobile: mobile1,

location:
document.getElementById("location")
.value.trim(),

instagram:
document.getElementById("instagram")
.value.trim(),

youtube:
document.getElementById("youtube")
.value.trim(),

about:
document.getElementById("about")
.value.trim()

};


localStorage.setItem(
"psw_profile",
JSON.stringify(profile)
);


document.getElementById("displayWorkName")
.textContent =
profile.workName ||
"Parbez Smart Works";


alert("Profile saved successfully!");

}

</script>

</body>
</html>
