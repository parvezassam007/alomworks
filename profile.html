<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">

<title>My Profile | Parbez Smart Works</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="style.css">

<style>

.page-container{
  max-width:700px;
  margin:auto;
  padding:18px;
}

.page-title{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}

.back-btn{
  width:42px;
  height:42px;
  border:0;
  border-radius:13px;
  background:white;
  color:#2563eb;
  font-size:17px;
  cursor:pointer;
}

.profile-header{
  background:linear-gradient(
    135deg,
    #2563eb,
    #1d4ed8
  );

  color:white;
  border-radius:22px;
  padding:25px;
  text-align:center;
  margin-bottom:18px;
}

.profile-logo{
  width:75px;
  height:75px;
  margin:auto;
  border-radius:23px;
  background:rgba(255,255,255,.18);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:34px;
}

.profile-header h2{
  margin-top:12px;
  font-size:21px;
}

.profile-header p{
  margin-top:5px;
  font-size:12px;
  opacity:.85;
}

.form-card{
  background:white;
  border:1px solid #e2e8f0;
  border-radius:20px;
  padding:18px;
}

.form-card h3{
  font-size:16px;
  margin-bottom:16px;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:bold;
  margin-bottom:6px;
}

.field input,
.field textarea{
  width:100%;
  padding:13px;

  border:1px solid #dbe2ea;
  border-radius:11px;

  background:#f8fafc;
  outline:none;

  font-size:14px;
}

.field input:focus,
.field textarea:focus{
  border-color:#2563eb;
  background:white;
}

.field textarea{
  min-height:90px;
  resize:vertical;
}

.save-btn{
  width:100%;
  padding:14px;

  border:0;
  border-radius:12px;

  background:#2563eb;
  color:white;

  font-weight:bold;
  font-size:14px;

  cursor:pointer;
}

.save-btn:active{
  transform:scale(.98);
}

.success{
  margin-top:12px;
  padding:11px;

  background:#dcfce7;
  color:#15803d;

  border-radius:10px;

  text-align:center;
  font-size:12px;
  display:none;
}

</style>

</head>


<body>


<header class="topbar">

<div class="brand">

<div class="brand-logo">
<i class="fa-solid fa-bolt"></i>
</div>

<div>

<h1>Parbez Smart Works</h1>

<p>
Electrical • Ceiling • Plumbing
</p>

</div>

</div>

</header>



<main class="page-container">


<div class="page-title">

<button
class="back-btn"
onclick="location.href='index.html'">

<i class="fa-solid fa-arrow-left"></i>

</button>

<h2>My Profile</h2>

</div>



<!-- PROFILE HEADER -->

<div class="profile-header">

<div class="profile-logo">

<i class="fa-solid fa-bolt"></i>

</div>


<h2 id="displayWorkName">
Parbez Smart Works
</h2>


<p>
Electrical • False Ceiling • Plumbing
</p>

</div>



<!-- FORM -->

<div class="form-card">

<h3>
Business Information
</h3>



<div class="field">

<label>
Work / Business Name
</label>

<input
id="workName"
type="text"
value="Parbez Smart Works"
placeholder="Enter business name">

</div>



<div class="field">

<label>
Owner Name
</label>

<input
id="ownerName"
type="text"
value="Parbez Alom Badrul Alom"
placeholder="Enter owner name">

</div>



<div class="field">

<label>
Mobile Number
</label>

<input
id="mobile"
type="tel"
maxlength="10"
inputmode="numeric"
placeholder="10 digit mobile number">

</div>



<div class="field">

<label>
Location
</label>

<input
id="location"
type="text"
value="Hojai, Assam"
placeholder="Enter business location">

</div>



<div class="field">

<label>
Instagram
</label>

<input
id="instagram"
type="text"
value="@parbez_works"
placeholder="@username">

</div>



<div class="field">

<label>
YouTube
</label>

<input
id="youtube"
type="text"
value="@parbezworks"
placeholder="@channel">

</div>



<div class="field">

<label>
About Your Work
</label>

<textarea
id="about"
placeholder="Write about your business"></textarea>

</div>



<button
class="save-btn"
onclick="saveProfile()">

<i class="fa-solid fa-floppy-disk"></i>

&nbsp; Save Profile

</button>


<div
id="successMessage"
class="success">

Profile saved successfully.

</div>

</div>

</main>



<script>


/* LOAD PROFILE */

function loadProfile(){

let saved;

try{

saved=JSON.parse(
localStorage.getItem("psw_profile") || "null"
);

}catch(error){

saved=null;

}


if(!saved) return;


document.getElementById("workName").value=
saved.workName || "Parbez Smart Works";


document.getElementById("ownerName").value=
saved.ownerName || "Parbez Alom Badrul Alom";


document.getElementById("mobile").value=
saved.mobile || "";


document.getElementById("location").value=
saved.location || "Hojai, Assam";


document.getElementById("instagram").value=
saved.instagram || "@parbez_works";


document.getElementById("youtube").value=
saved.youtube || "@parbezworks";


document.getElementById("about").value=
saved.about || "";


document.getElementById("displayWorkName")
.textContent=
saved.workName || "Parbez Smart Works";

}



/* SAVE PROFILE */

function saveProfile(){

const workName=
document.getElementById("workName")
.value.trim();


const ownerName=
document.getElementById("ownerName")
.value.trim();


const mobile=
document.getElementById("mobile")
.value.trim();


const location=
document.getElementById("location")
.value.trim();


const instagram=
document.getElementById("instagram")
.value.trim();


const youtube=
document.getElementById("youtube")
.value.trim();


const about=
document.getElementById("about")
.value.trim();



if(!workName){

alert("Please enter business name.");

return;

}



/* MOBILE VALIDATION */

if(
mobile &&
!/^[0-9]{10}$/.test(mobile)
){

alert(
"Please enter a valid 10 digit mobile number."
);

return;

}



const profile={

workName:workName,

ownerName:ownerName,

mobile:mobile,

location:location,

instagram:instagram,

youtube:youtube,

about:about

};



localStorage.setItem(

"psw_profile",

JSON.stringify(profile)

);



document.getElementById(
"displayWorkName"
).textContent=
workName;



const success=
document.getElementById(
"successMessage"
);

success.style.display="block";


setTimeout(()=>{

success.style.display="none";

},2500);

}



/* LOAD ON PAGE OPEN */

loadProfile();

</script>


</body>

</html>
